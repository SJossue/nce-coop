[project]
name = "nce-coop"
version = "0.1.0"
description = "Tooling for the NJIT NCE Undergraduate Engineering Co-op posting-monitoring process"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
